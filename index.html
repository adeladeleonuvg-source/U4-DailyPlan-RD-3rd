        // Fullscreen Toggle function
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showMsg("Error attempting to enable fullscreen: " + err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Custom Message Box replacement for alert()
        function showMsg(text) {
            const box = document.createElement('div');
            box.className = 'fixed inset-0 bg-black/50 flex items-center justify-center z-50';
            box.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center">
                <p class="text-slate-800 font-semibold mb-4">${text}</p>
                <button onclick="this.parentElement.parentElement.remove()" class="bg-montanoBlue text-white px-4 py-2 rounded-lg font-bold">OK</button>
            </div>`;
            document.body.appendChild(box);
        }

                    homework: "Home Investigation: Write a thank-you note to someone in your family who helps you learn and succeed every day."
                },
                evaluation: "Comprehensive rubric assessing reading comprehension, collaborative project quality, and speaking skills."
            }
        };

        let currentWeek = 1;
        let currentTab = 'intro';

        function switchClass(weekNum) {
            currentWeek = weekNum;
            document.querySelectorAll('.week-btn').forEach((btn, idx) => {
                if (idx + 1 === weekNum) {
                    btn.className = "week-btn px-4 py-2 rounded-lg font-semibold text-sm bg-montanoBlue text-white shadow transition";
                } else {
                    btn.className = "week-btn px-4 py-2 rounded-lg font-semibold text-sm bg-white text-montanoBlue hover:bg-slate-100 shadow transition";
                }
            });
            renderClass();
        }

        function switchTab(tabName) {
            currentTab = tabName;
            const tabs = ['intro', 'individual', 'cooperative', 'closing'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tabName) {
                    btn.className = "p-3 rounded-xl font-bold text-center transition shadow bg-montanoBlue text-white flex flex-col items-center justify-center";
                } else {
                    btn.className = "p-3 rounded-xl font-bold text-center transition shadow bg-white text-montanoBlue hover:bg-slate-50 flex flex-col items-center justify-center";
                }
            });
            renderTabContent();
        }

        function renderClass() {
            const data = classesData[currentWeek];
            
            document.getElementById('class-header-card').innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="bg-montanoYellow text-slate-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">${data.week}</span>
                        <h2 class="text-xl md:text-2xl font-bold text-montanoBlue mt-2">${data.theme}</h2>
                        <p class="text-sm text-slate-600 mt-1"><strong>CNB Guatemala:</strong> ${data.cnb}</p>
                    </div>
                    <div class="bg-montanoBg p-3 rounded-xl border border-montanoLightBlue text-xs space-y-1 min-w-[240px]">
                        <p><strong>Key Competencies:</strong> ${data.keyCompetencies}</p>
                        <p><strong>Montano Habit:</strong> ${data.montanoHabit}</p>
                        <p><strong>Resources:</strong> ${data.resources}</p>
                    </div>
                </div>
            `;
            renderTabContent();
        }

        function renderTabContent() {
            const data = classesData[currentWeek];
            const container = document.getElementById('tab-content-container');

            if (currentTab === 'intro') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-montanoBlue tab-transition">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="bg-montanoBlue text-white p-3 rounded-xl"><i class="fa-solid fa-bolt text-xl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-montanoBlue">Moment I) Introduction & Warm-Up (~5 minutes)</h3>
                                <p class="text-xs text-slate-500">Activating prior knowledge & connecting with real life (Leader in Me integration)</p>
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 mt-4">
                            <div class="bg-montanoBg p-4 rounded-xl border border-montanoLightBlue">
                                <h4 class="font-bold text-montanoBlue mb-2"><i class="fa-solid fa-gamepad mr-2"></i>Warm-Up & Vocabulary Review (Unit 8 & 9 Vocab 1 & 2)</h4>
                                <p class="text-sm text-slate-700">${data.intro.activity}</p>
                            </div>
                            <div class="bg-montanoBg p-4 rounded-xl border border-montanoLightBlue">
                                <h4 class="font-bold text-montanoBlue mb-2"><i class="fa-solid fa-earth-americas mr-2"></i>Real-World Connection</h4>
                                <p class="text-sm text-slate-700">${data.intro.realWorld}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'individual') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-montanoTeal tab-transition">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="bg-montanoTeal text-white p-3 rounded-xl"><i class="fa-solid fa-book-open text-xl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-montanoTeal">Moment II) Trabajo Individual (20 minutes)</h3>
                                <p class="text-xs text-slate-500">Autonomous student production, reading analysis, and book exercises</p>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <h4 class="font-bold text-slate-800 mb-2">Student Task / Workbook Assignment:</h4>
                                <p class="text-sm text-slate-700">${data.individual.task}</p>
                            </div>
                            <!-- Accordion for Hidden Solution -->
                            <div class="border border-montanoLightBlue rounded-xl overflow-hidden">
                                <button onclick="toggleAccordion('solution-box')" class="w-full bg-montanoLightBlue text-slate-900 font-bold p-3 text-left flex justify-between items-center transition hover:bg-sky-200">
                                    <span><i class="fa-solid fa-eye mr-2"></i>${data.individual.solutionTitle}</span>
                                    <i id="solution-icon" class="fa-solid fa-chevron-down"></i>
                                </button>
                                <div id="solution-box" class="hidden p-4 bg-white text-slate-700 border-t border-montanoLightBlue">
                                    ${data.individual.solutionContent}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'cooperative') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-montanoOlive tab-transition">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="bg-montanoOlive text-white p-3 rounded-xl"><i class="fa-solid fa-users text-xl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-montanoOlive">Moment III) Trabajo Cooperativo / en Equipo (30 minutes)</h3>
                                <p class="text-xs text-slate-500">Structured teamwork with roles and tangible learning products</p>
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 mt-4">
                            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                                <h4 class="font-bold text-emerald-800 mb-2"><i class="fa-solid fa-people-group mr-2"></i>Collaborative Task & Roles</h4>
                                <p class="text-sm text-slate-700">${data.cooperative.task}</p>
                            </div>
                            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                                <h4 class="font-bold text-emerald-800 mb-2"><i class="fa-solid fa-box-archive mr-2"></i>Concrete Product</h4>
                                <p class="text-sm text-slate-700">${data.cooperative.product}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'closing') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-6 border-t-4 border-montanoYellow tab-transition">
                        <div class="flex items-center space-x-3 mb-4">
                            <div class="bg-yellow-500 text-white p-3 rounded-xl"><i class="fa-solid fa-flag-checkered text-xl"></i></div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">Moment IV) Plenaria, Simulador & Cierre (15 minutes)</h3>
                                <p class="text-xs text-slate-500">Group presentations, interactive simulators, home investigation, and checklist evaluation</p>
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6 mb-6">
                            <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                                <h4 class="font-bold text-amber-900 mb-2"><i class="fa-solid fa-chalkboard-user mr-2"></i>Plenary & Guiding Questions</h4>
                                <p class="text-sm text-slate-700">${data.closing.plenary}</p>
                            </div>
                            <div class="bg-amber-50 p-4 rounded-xl border border-amber-200">
                                <h4 class="font-bold text-amber-900 mb-2"><i class="fa-solid fa-laptop-code mr-2"></i>Interactive Simulator / Game</h4>
                                <p class="text-sm text-slate-700">${data.closing.simulator}</p>
                            </div>
                        </div>
                        <div class="bg-sky-50 p-4 rounded-xl border border-sky-200 mb-6">
                            <h4 class="font-bold text-montanoBlue mb-1"><i class="fa-solid fa-house-chimney mr-2"></i>Home Investigation Task</h4>
                            <p class="text-sm text-slate-700">${data.closing.homework}</p>
                        </div>

                        <!-- Interactive Evaluation Checklist Table -->
                        <div class="border border-slate-200 rounded-xl overflow-hidden">
                            <div class="bg-montanoBlue text-white p-3 font-bold text-sm flex justify-between items-center">
                                <span><i class="fa-solid fa-clipboard-check mr-2"></i>Interactive Plenary Evaluation Checklist</span>
                                <span class="text-xs bg-montanoYellow text-slate-900 px-2 py-0.5 rounded">Group Rubric</span>
                            </div>
                            <div class="p-4 bg-slate-50 overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead>
                                        <tr class="border-b border-slate-300 text-slate-700">
                                            <th class="pb-2">Evaluation Criteria</th>
                                            <th class="pb-2 text-center">Outstanding (3)</th>
                                            <th class="pb-2 text-center">Satisfactory (2)</th>
                                            <th class="pb-2 text-center">In Progress (1)</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 text-slate-600">
                                        <tr>
                                            <td class="py-2 font-medium">1. Domain of the theme & clarity in explanation</td>
                                            <td class="text-center"><input type="radio" name="eval1" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval1" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval1" class="accent-montanoBlue"></td>
                                        </tr>
                                        <tr>
                                            <td class="py-2 font-medium">2. Logic / procedure followed by the team</td>
                                            <td class="text-center"><input type="radio" name="eval2" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval2" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval2" class="accent-montanoBlue"></td>
                                        </tr>
                                        <tr>
                                            <td class="py-2 font-medium">3. Collaborative teamwork & equal participation</td>
                                            <td class="text-center"><input type="radio" name="eval3" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval3" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval3" class="accent-montanoBlue"></td>
                                        </tr>
                                        <tr>
                                            <td class="py-2 font-medium">4. Ability to respond to plenary questions</td>
                                            <td class="text-center"><input type="radio" name="eval4" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval4" class="accent-montanoBlue"></td>
                                            <td class="text-center"><input type="radio" name="eval4" class="accent-montanoBlue"></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p class="text-xs text-slate-500 mt-3"><em>Note: Use this interactive rubric during classroom presentations to record team scores directly on the Pizarra.</em></p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function toggleAccordion(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('solution-icon');
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.className = "fa-solid fa-chevron-up";
            } else {
                el.classList.add('hidden');
                icon.className = "fa-solid fa-chevron-down";
            }
        }

        // Initialize on load
        window.onload = function() {
            renderClass();
        };
    </script>
</body>
</html>
